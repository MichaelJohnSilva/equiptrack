<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EquipTrack · Sign in</title>
<meta name="author" content="Michael John Woo Silva">
<style>
  .credit{max-width:980px;margin:8px auto 0;padding:16px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--mute)}
.credit b{color:var(--ink);font-weight:600}
:root{--bg:#f3f5f2;--card:#fff;--ink:#1b2a24;--mute:#5f6f67;--line:#d9e0db;--pri:#14675a;--priInk:#fff;--ok:#1d7a3e;--okbg:#dff3e5;--no:#a62b2b;--nobg:#f9e1e1;--wait:#8a5a00;--waitbg:#fdf0cf;--info:#26537f;--infobg:#dfeaf6}
@media (prefers-color-scheme:dark){:root{--bg:#101815;--card:#18231f;--ink:#e6eee9;--mute:#9bada4;--line:#2b3b34;--pri:#3fb5a2;--priInk:#06231e;--ok:#7fd39a;--okbg:#183623;--no:#f08a8a;--nobg:#3d1b1b;--wait:#e8c15d;--waitbg:#3a2f12;--info:#8bb8e8;--infobg:#17293c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font:700 22px Georgia,serif;text-decoration:none;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn.p{background:var(--pri);color:var(--priInk);border-color:var(--pri);font-weight:600}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{color:var(--no);border-color:var(--no)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri);font-weight:600}
.dot{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--no);color:var(--bg);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{font-size:17px}
.mute{color:var(--mute);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.Pending{background:var(--waitbg);color:var(--wait)}.Approved{background:var(--okbg);color:var(--ok)}.Rejected,.Cancelled{background:var(--nobg);color:var(--no)}.Returned,.Forwarded{background:var(--infobg);color:var(--info)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px}
.avail{font-weight:700;color:var(--pri)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.modal .card{width:100%;max-width:430px;max-height:90%;overflow:auto}
.err{color:var(--no);font-size:13px;margin-top:8px;min-height:18px}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0 6px}.nums b{display:block;font:700 22px Georgia,serif}.nums span{font-size:12px;color:var(--mute)}.nums .low{color:var(--no)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.od{color:var(--no);font-weight:600}
.dh{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.again{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--infobg);color:var(--info)}
.rec{border-top:1px solid var(--line);padding:10px 0}
.rec:first-child{border-top:0}
details{margin-top:10px;font-size:13px}summary{cursor:pointer;color:var(--pri);font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:10}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="credit">
  Designed and developed by <b>Michael John Woo Silva</b><br>
  Cebu City, Philippines<br>
  &copy; 2026 EquipTrack. All rights reserved.
</div>
<div class="modal" id="modal"><div class="card" id="mbody"></div></div>
<div class="toast" id="toast"></div>
<script>
var LBL={Pending:'Pending (lab)',Forwarded:'Sent to admin'};
var ROLES={student:'Student',faculty:'Faculty member',lab:'Laboratory personnel',admin:'Admin'};
var T=null,U=null,tab='',D={},q='';
try{var s0=JSON.parse(sessionStorage.getItem('user'));if(s0){T=s0.token;U=s0}}catch(e){}
if(!T)location.replace('login.html');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2800)}
async function api(path,method,body){
  var r=await fetch('/api'+path,{method:method||'GET',headers:Object.assign({'Content-Type':'application/json'},T?{Authorization:'Bearer '+T}:{}),body:body?JSON.stringify(body):undefined});
  var j=await r.json().catch(function(){return{}});
  if(r.status==401&&T){logout();throw new Error('Your session ended. Please sign in again.')}
  if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');return j}
function logout(){T=U=null;D={};tab='';try{sessionStorage.removeItem('user')}catch(e){}location.replace('login.html')}
function tabsFor(){var r=U.role;
  if(r=='lab')return[['rev','Review requests'],['stock','Stock'],['inv','Inventory'],['hist','Borrow history'],['people','Students & faculty'],['all','All requests'],['pen','Penalties']];
  if(r=='admin')return[['rev','Review requests'],['stock','Stock'],['inv','Inventory'],['dep','Departments'],['hist','Borrow history'],['people','Students & faculty'],['all','All requests'],['pen','Penalties'],['usr','Accounts']];
  return[['eq','Equipment'],['mine','My requests']]}
var SRC={eq:'/equipment',inv:'/equipment',mine:'/requests/mine',rev:'/requests/review',all:'/requests',hist:'/requests',people:'/people',stock:'/stock',pen:'/penalties'};
async function go(t){tab=t;q='';
  try{if(SRC[t])D[t]=await api(SRC[t]);if(U.role=='admin'&&(t=='usr'||t=='inv'||t=='dep'))D.dep=await api('/departments');if(t=='usr')D.people=await api('/people')}
  catch(e){if(!T)return;toast(e.message);if(SRC[t])D[t]=D[t]||[]}
  // The red numbers on the tabs: what is waiting for this lab personnel or admin.
  if(U.role=='lab'||U.role=='admin'){try{D.alerts=await api('/alerts')}catch(e){}}
  render()}
function render(){var a=document.getElementById('app');
  if(!U)return;
  var t=tabsFor();if(!tab)return go(t[0][0]);
  a.innerHTML='<header><div><div class="brand">EquipTrack</div><div class="mute">'+esc(U.name)+' · '+ROLES[U.role]+(U.department?' · '+esc(U.department):'')+'</div></div><button class="btn sm" onclick="logout()">Log out</button></header><div class="tabs">'+t.map(function(x){var n=D.alerts&&D.alerts[x[0]];return'<button class="tab'+(x[0]==tab?' on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+(n?' <span class="dot">'+n+'</span>':'')+'</button>'}).join('')+'</div>'+({eq:eqView,mine:mineView,rev:revView,inv:invView,all:allView,hist:histView,usr:usrView,people:peopleView,stock:stockView,pen:penView,dep:depView}[tab])()}
// ---------- equipment & requests ----------
// Students and faculty only receive the equipment of their own enrolled department from the server.
function eqView(){var l=(D.eq||[]).filter(function(e){return(e.name+e.category).toLowerCase().indexOf(q.toLowerCase())>-1});
  var head=U.department?'<p class="mute" style="margin:0 0 10px">Equipment available in <b>'+esc(U.department)+'</b>, your department.</p>':'';
  var none=!U.department?'Your account has no department yet. Ask the admin to set your enrolled department.':(q?'No equipment matches your search.':'There is no equipment in your department yet.');
  return head+'<input placeholder="Search equipment" value="'+esc(q)+'" oninput="q=this.value;render();var i=document.querySelector(\'input\');i.focus();i.setSelectionRange(q.length,q.length)" style="max-width:320px;margin-bottom:12px"><div class="grid">'+(l.length?l.map(function(e){return'<div class="card"><h3>'+esc(e.name)+'</h3><div class="mute">'+esc(e.category)+' · '+esc(e.department||'No department')+'</div><p><span class="avail">'+e.available_today+'</span> of '+e.qty+' available today</p><button class="btn p sm" onclick="openReq('+e.id+')">Borrow or reserve</button></div>'}).join(''):'<div class="empty" style="grid-column:1/-1">'+none+'</div>')+'</div>'}
function openReq(id){var e=D.eq.filter(function(x){return x.id==id})[0];
  document.getElementById('mbody').innerHTML='<h2>'+esc(e.name)+'</h2><p class="mute">Laboratory personnel review it first, then the admin decides. Borrowed items must be returned to the laboratory, where the laboratory personnel check their condition.</p><label for="rt">Request type</label><select id="rt" onchange="typeChg()"><option value="borrow">Borrow now</option><option value="reserve">Reserve for a later date</option></select><label for="rq">Quantity (max '+e.qty+')</label><input id="rq" type="number" min="1" max="'+e.qty+'" value="1"><label for="rf">From</label><input id="rf" type="date" value="'+today()+'" min="'+today()+'" disabled><label for="rtn">Return by</label><input id="rtn" type="date" value="'+today()+'" min="'+today()+'"><label for="rp">Purpose</label><textarea id="rp" rows="2" placeholder="e.g. Biology lab activity"></textarea><div class="err" id="rerr"></div><div class="row" style="margin-top:8px"><button class="btn p" id="rbtn" onclick="sendReq('+id+')">Send request</button><button class="btn" onclick="closeM()">Cancel</button></div>';
  document.getElementById('modal').classList.add('on')}
function typeChg(){var r=document.getElementById('rt').value=='reserve',f=document.getElementById('rf');f.disabled=!r;if(!r)f.value=today()}
function closeM(){document.getElementById('modal').classList.remove('on')}
async function sendReq(id){var v=function(i){return document.getElementById(i).value},er=document.getElementById('rerr'),b=document.getElementById('rbtn');
  b.disabled=true;er.textContent='';
  try{await api('/requests','POST',{equipmentId:id,qty:+v('rq'),type:v('rt'),from:v('rf'),to:v('rtn'),purpose:v('rp')});closeM();toast('Request sent');go('mine')}
  catch(e){er.textContent=e.message;b.disabled=false}}
// A borrowed item that is out, past its return date, and whose return was not sent yet.
function lateLoan(r){return r.status=='Approved'&&r.type=='borrow'&&!r.return_condition&&!r.return_requested_at&&r.date_to<today()}
// Out on loan and not checked yet by the laboratory personnel.
function outLoan(r){return r.status=='Approved'&&r.type=='borrow'&&!r.return_condition}
function extra(r){var h='',p=r.penalty_status;
  if(lateLoan(r))h+='<div class="od">Return required. This item was due '+esc(r.date_to)+'.</div>';
  if(outLoan(r)&&r.return_requested_at)h+='<div class="mute"><b>Returned to the laboratory</b> · '+esc(r.return_requested_at.slice(0,10))+'. Waiting for the laboratory personnel to check the condition.</div>';
  if(r.return_condition)h+='<div class="mute">Condition checked '+esc((r.returned_at||'').slice(0,10))+(r.inspector?' by laboratory personnel '+esc(r.inspector):'')+' · Condition: <b class="'+(r.return_condition=='Damaged'?'od':'')+'">'+r.return_condition+'</b>'+(r.return_notes?' · '+esc(r.return_notes):'')+'</div>';
  if(r.return_condition=='Damaged'){var dq=r.damaged_qty||r.qty,rp=r.repaired_qty||0,left=dq-rp;
    h+='<div class="od">Damaged units: '+dq+' of '+r.qty+'.'+(left>0?(rp?' '+rp+' repaired or replaced and back in the available stock. '+left+' still not available.':' Not added back to the available stock.'):'')+'</div>';
    if(left<1)h+='<div class="mute"><b>All '+dq+' damaged unit'+(dq==1?'':'s')+' repaired or replaced.</b> Back in the available stock'+(r.repaired_at?' · '+esc(r.repaired_at.slice(0,10)):'')+'.</div>'}
  if(r.status=='Approved'&&r.return_condition=='Good')h+='<div class="mute"><b>Checked: good condition.</b> The admin was notified and will confirm the return.</div>';
  if(r.return_confirmed_at)h+='<div class="mute">Return confirmed by the admin · '+esc(r.return_confirmed_at.slice(0,10))+'</div>';
  if(p=='Pending')h+='<div class="mute"><b>Penalty:</b> waiting for the admin to decide</div>';
  else if(p=='Unpaid'||p=='Paid')h+='<div class="mute"><b>Penalty:</b> ₱'+Number(r.penalty_amount).toFixed(2)+' ('+p+')'+(r.penalty_note?' · '+esc(r.penalty_note):'')+'</div>';
  else if(p=='Waived')h+='<div class="mute"><b>Penalty:</b> none (waived by the admin)</div>';
  if(p=='Paid'&&r.receipt_no)h+='<div class="mute">Receipt no.: <b>'+esc(r.receipt_no)+'</b> · paid '+esc((r.paid_at||'').slice(0,10))+'</div>';
  return h}
function reqCard(r,act){return'<div class="card"><div class="row sp"><h3>'+esc(r.equipment)+' × '+r.qty+'</h3><span class="badge '+r.status+'">'+(LBL[r.status]||r.status)+'</span></div><div class="mute">'+(r.type=='borrow'?'Borrow':'Reservation')+' · '+r.date_from+' to '+r.date_to+' · '+esc(r.requester)+' ('+ROLES[r.requester_role]+')</div><p style="margin:6px 0">'+esc(r.purpose)+'</p>'+extra(r)+(act||'')+'</div>'}
function mineView(){var l=D.mine||[],late=l.filter(lateLoan).length;
  return(late?'<div class="card" style="border-color:var(--no);margin-bottom:12px"><b class="od">Return required</b><p class="mute" style="margin:4px 0 0">You have '+late+' borrowed item'+(late==1?'':'s')+' past the return date. Bring '+(late==1?'it':'them')+' back to the laboratory and tap Return item before you can make a new request.</p></div>':'')+
  (l.length?'<div class="list">'+l.map(function(r){return reqCard(r,r.status=='Pending'?'<button class="btn no sm" onclick="cancelReq('+r.id+')">Cancel request</button>':(outLoan(r)&&!r.return_requested_at?'<button class="btn p sm" onclick="openReturnRequest('+r.id+')">Return item</button>':''))}).join('')+'</div>':'<div class="empty">You have no requests yet. Open Equipment to borrow or reserve something.</div>')}
function revView(){var l=D.rev||[];return l.length?'<div class="list">'+l.map(function(r){var a='';
  if(U.role=='lab'){
    if(r.status=='Pending')a='<button class="btn p sm" onclick="review('+r.id+',\'Forwarded\')">Send to admin</button>';
    else if(r.status=='Forwarded')a='<span class="mute">Waiting for the admin to approve or reject.</span>';
    else if(outLoan(r))a='<button class="btn p sm" onclick="openReturn('+r.id+')">Check returned item</button>';
  }else if(r.status=='Forwarded')a='<div class="row"><button class="btn ok sm" onclick="review('+r.id+',\'Approved\')">Approve</button><button class="btn no sm" onclick="review('+r.id+',\'Rejected\')">Reject</button></div>';
  else if(r.status=='Approved'&&r.return_condition=='Good')a='<button class="btn ok sm" onclick="confirmReturn('+r.id+')">Confirm return (+'+r.qty+' available)</button>';
  else if(r.return_condition=='Damaged'&&r.penalty_status=='Pending')a='<button class="btn p sm" onclick="go(\'pen\')">Decide on the penalty</button>';
  return reqCard(r,a)}).join('')+'</div>':'<div class="empty">No requests to review right now.</div>'}
function allView(){var l=D.all||[];return l.length?'<div class="list">'+l.map(function(r){return reqCard(r)}).join('')+'</div>':'<div class="empty">No requests have been made yet.</div>'}
async function review(id,st){try{await api('/requests/'+id,'PATCH',{status:st});toast(st=='Forwarded'?'Sent to admin':'Marked '+st.toLowerCase());go(tab)}catch(e){toast(e.message)}}
async function confirmReturn(id){try{var j=await api('/requests/'+id+'/confirm-return','POST');toast('Return confirmed. '+j.available+' now available.');go(tab)}catch(e){toast(e.message)}}
async function cancelReq(id){try{await api('/requests/'+id+'/cancel','POST');toast('Request cancelled');go('mine')}catch(e){toast(e.message)}}
// ---------- borrow history (lab and admin) ----------
// One card per student or faculty member. Lab personnel get the records of their own department only,
// the admin gets everything. Every approved borrow is numbered, and the 2nd borrow onward is tagged "Borrowed again".
function actualBorrow(r){return r.status=='Approved'||r.status=='Returned'}
function histView(){var all=(D.hist||[]).filter(function(r){return r.type=='borrow'&&r.requester_role!='lab'&&r.requester_role!='admin'}),by={};
  all.forEach(function(r){(by[r.user_id]=by[r.user_id]||[]).push(r)});
  var people=Object.keys(by).map(function(id){var l=by[id].slice().sort(function(a,b){return a.id-b.id});return{id:id,l:l,f:l[0]}})
    .filter(function(p){return(p.f.requester+' '+p.f.requester_id).toLowerCase().indexOf(q.toLowerCase())>-1})
    .sort(function(a,b){return a.f.requester.localeCompare(b.f.requester)});
  var note=U.role=='lab'?'Borrow history of the students and faculty who borrowed from <b>'+esc(U.department||'your department')+'</b>.':'Borrow history of every student and faculty member, across all departments.';
  return'<p class="mute" style="margin:0 0 10px">'+note+'</p><input placeholder="Search by name or ID number" value="'+esc(q)+'" oninput="q=this.value;render();var i=document.querySelector(\'input\');i.focus();i.setSelectionRange(q.length,q.length)" style="max-width:320px;margin-bottom:12px">'+
  (people.length?'<div class="list">'+people.map(function(p){
    var n=0,nums={};p.l.forEach(function(r){if(actualBorrow(r)){n++;nums[r.id]=n}});
    var out=p.l.filter(function(r){return r.status=='Approved'&&!r.return_condition}).length,
        dmg=p.l.filter(function(r){return r.return_condition=='Damaged'}).length,
        last=p.l.filter(actualBorrow).slice(-1)[0];
    var recs=p.l.slice().reverse().map(function(r){var k=nums[r.id];
      return'<div class="rec"><div class="row sp"><b>'+esc(r.equipment)+' × '+r.qty+'</b><span class="badge '+r.status+'">'+(LBL[r.status]||r.status)+'</span></div><div class="row" style="margin:2px 0">'+(k?'<span class="mute"><b>Borrow #'+k+'</b></span>'+(k>1?'<span class="again">Borrowed again</span>':''):'<span class="mute">Not borrowed (request only)</span>')+'</div><div class="mute">'+r.date_from+' to '+r.date_to+(U.role=='admin'?' · '+esc(r.department||'No department'):'')+'</div><div class="mute">'+esc(r.purpose)+'</div>'+extra(r)+'</div>'}).join('');
    return'<div class="card"><div class="row sp"><h3>'+esc(p.f.requester)+'</h3><span class="mute">'+ROLES[p.f.requester_role]+' · ID '+esc(p.f.requester_id)+'</span></div><div class="mute">Enrolled in: '+esc(p.f.requester_department||'No department')+'</div><div class="nums" style="grid-template-columns:repeat(3,1fr)"><div><b>'+n+'</b><span>Times borrowed</span></div><div><b>'+out+'</b><span>Out now</span></div><div><b class="'+(dmg?'low':'')+'">'+dmg+'</b><span>Damaged returns</span></div></div>'+(last?'<div class="mute">Last borrowed: '+esc(last.date_from)+' · '+esc(last.equipment)+'</div>':'')+'<details><summary>Borrow history ('+p.l.length+' record'+(p.l.length==1?'':'s')+')</summary>'+recs+'</details></div>'}).join('')+'</div>':'<div class="empty">'+(q?'No student or faculty member matches your search.':'Nobody has borrowed yet.')+'</div>')}
// ---------- returning items and penalties ----------
// Looks up a request by id in the list that is on screen (My requests or Review requests).
function findReq(id){return(D[tab]||[]).filter(function(x){return x.id==id})[0]}
// Step 1 (student or faculty): the item was brought back to the laboratory.
function openReturnRequest(id){var r=findReq(id);
  document.getElementById('mbody').innerHTML='<h2>Return item</h2><p class="mute">Bring '+(r?r.qty+' × '+esc(r.equipment):'the item')+' back to the laboratory of <b>'+esc(r&&r.department||'its department')+'</b> first. The laboratory personnel will check its condition and report it to the admin.</p><div class="err" id="rerr"></div><div class="row" style="margin-top:8px"><button class="btn p" id="rbtn" onclick="sendReturnRequest('+id+')">I returned it</button><button class="btn" onclick="closeM()">Cancel</button></div>';
  document.getElementById('modal').classList.add('on')}
async function sendReturnRequest(id){var er=document.getElementById('rerr'),b=document.getElementById('rbtn');er.textContent='';b.disabled=true;
  try{await api('/requests/'+id+'/return-request','POST');closeM();toast('Return sent. The laboratory personnel will check the item.');go(tab)}catch(e){er.textContent=e.message;b.disabled=false}}
// Step 2 (laboratory personnel): check the item and record its condition. This also notifies the admin.
function openReturn(id){var r=findReq(id),n=r?r.qty:1;
  document.getElementById('mbody').innerHTML='<h2>Check returned item</h2><p class="mute">'+(r?esc(r.requester)+' returned '+r.qty+' × '+esc(r.equipment)+'. ':'')+'Check the item and record its condition. The admin is notified of your result. Damaged units are not added back to the available stock until the admin marks them repaired or replaced.</p><label for="rc">Condition of the item (required)</label><select id="rc" onchange="dmgChg('+n+')"><option value="">Choose the condition</option><option value="Good">Good, no damage</option><option value="Damaged">Damaged</option></select><div id="dbox" style="display:none"><label for="rdq">How many units are damaged? (of '+n+')</label><input id="rdq" type="number" min="1" max="'+n+'" value="'+n+'"></div><label for="rn">Notes (required if damaged)</label><textarea id="rn" rows="3" placeholder="Describe the condition, or what is damaged"></textarea><div class="err" id="rerr"></div><div class="row" style="margin-top:8px"><button class="btn p" id="rbtn" onclick="sendReturn('+id+')">Submit and notify admin</button><button class="btn" onclick="closeM()">Cancel</button></div>';document.getElementById('modal').classList.add('on')}
function dmgChg(n){document.getElementById('dbox').style.display=(document.getElementById('rc').value=='Damaged'&&n>1)?'block':'none'}
async function sendReturn(id){var er=document.getElementById('rerr'),b=document.getElementById('rbtn'),c=document.getElementById('rc').value;er.textContent='';
  if(!c){er.textContent='Choose the condition of the item.';return}
  b.disabled=true;
  try{var j=await api('/requests/'+id+'/return','POST',{condition:c,notes:document.getElementById('rn').value,damagedQty:+document.getElementById('rdq').value});closeM();toast(j.waiting?'Recorded as good. The admin was notified to confirm the return.':'Recorded as damaged. The admin was notified to decide on a penalty.');go(tab)}catch(e){er.textContent=e.message;b.disabled=false}}
function penView(){var l=D.pen||[],adm=U.role=='admin';
  return(adm?'':'<p class="mute" style="margin-bottom:10px">Damaged returns in your department. The admin decides on penalties.</p>')+(l.length?'<div class="list">'+l.map(function(r){var a='';
  if(adm&&r.penalty_status=='Pending')a='<div class="row"><input id="pa'+r.id+'" type="number" min="1" step="0.01" placeholder="Amount (₱)" aria-label="Penalty amount" style="width:140px"><input id="pn'+r.id+'" placeholder="Reason" aria-label="Reason" style="flex:1;min-width:140px"><button class="btn p sm" onclick="penalty('+r.id+',\'set\')">Set penalty</button><button class="btn sm" onclick="penalty('+r.id+',\'waive\')">No penalty</button></div>';
  else if(adm&&r.penalty_status=='Unpaid')a='<div class="row"><input id="pr'+r.id+'" placeholder="Official receipt no." aria-label="Official receipt number" style="width:200px"><button class="btn ok sm" onclick="penalty('+r.id+',\'paid\')">Mark as paid</button></div>';
  return reqCard(r,a)}).join('')+'</div>':'<div class="empty">No damaged returns.</div>')}
async function penalty(id,action){var b={action:action};
  if(action=='set'){b.amount=+document.getElementById('pa'+id).value;b.note=document.getElementById('pn'+id).value}
  if(action=='paid')b.receipt=document.getElementById('pr'+id).value;
  try{await api('/requests/'+id+'/penalty','POST',b);toast('Saved');go('pen')}catch(e){toast(e.message)}}
// ---------- stock (lab and admin) ----------
function stockView(){var l=D.stock||[],t=today();
  return l.length?'<div class="grid">'+l.map(function(e){var out=e.qty?Math.round((e.qty-e.available)/e.qty*100):0;
    return'<div class="card"><h3>'+esc(e.name)+'</h3><div class="mute">'+esc(e.category)+'</div><div class="nums" style="grid-template-columns:repeat(5,1fr)"><div><b>'+e.qty+'</b><span>Total</span></div><div><b>'+e.borrowed+'</b><span>Borrowed</span></div><div><b>'+e.reserved+'</b><span>Reserved</span></div><div><b class="'+(e.damaged?'low':'')+'">'+e.damaged+'</b><span>Damaged</span></div><div><b class="'+(e.available<1?'low':'')+'">'+e.available+'</b><span>Left today</span></div></div><div class="bar"><i style="width:'+Math.min(Math.max(out,0),100)+'%"></i></div>'+(e.damaged?'<div class="mute" style="margin-top:6px">'+e.damaged+' damaged unit'+(e.damaged==1?' is':'s are')+' not counted as available.</div>':'')+
    (e.holders.length?'<details><summary>Who has it ('+e.holders.length+')</summary>'+e.holders.map(function(h){var od=h.type=='borrow'&&h.date_to<t&&!h.return_condition&&!h.return_requested_at;return'<p style="margin:6px 0">'+esc(h.requester)+' ('+ROLES[h.role]+', '+esc(h.id_number)+') × '+h.qty+'<br><span class="mute">'+(h.type=='borrow'?'Borrowed · due ':'Reserved · '+h.date_from+' to ')+h.date_to+'</span>'+(od?' <span class="od">Overdue</span>':'')+(h.return_condition?' <span class="mute">Checked, waiting for the admin to confirm</span>':(h.type=='borrow'&&h.return_requested_at?' <span class="mute">Returned, waiting for the lab to check</span>':''))+'</p>'}).join('')+'</details>':'<div class="mute" style="margin-top:8px">Nobody has this item right now.</div>')+'</div>'}).join('')+'</div>':'<div class="empty">No equipment yet.</div>'}
// ---------- students & faculty (admin and lab) ----------
function peopleView(){var l=(D.people||[]).filter(function(p){return(p.name+' '+p.id_number).toLowerCase().indexOf(q.toLowerCase())>-1});
  return'<input placeholder="Search by name or ID number" value="'+esc(q)+'" oninput="q=this.value;render();var i=document.querySelector(\'input\');i.focus();i.setSelectionRange(q.length,q.length)" style="max-width:320px;margin-bottom:12px">'+(U.role=='lab'?'<p class="mute" style="margin-bottom:10px">People who requested equipment from your department.</p>':'')+'<div class="grid">'+(l.length?l.map(function(p){return'<div class="card"><h3>'+esc(p.name)+'</h3><div class="mute">'+ROLES[p.role]+' · ID '+esc(p.id_number)+'</div><div class="mute">Enrolled in: '+esc(p.department||'No department')+'</div><p>'+p.total+' request'+(p.total==1?'':'s')+' · <span class="avail">'+p.borrowing+'</span> borrowing now</p><button class="btn p sm" onclick="openPerson('+p.id+')">View details</button></div>'}).join(''):'<div class="empty">No students or faculty found.</div>')+'</div>'}
async function openPerson(id){try{var p=await api('/people/'+id);
  document.getElementById('mbody').innerHTML='<h2>'+esc(p.name)+'</h2><p class="mute">'+ROLES[p.role]+' · ID number '+esc(p.id_number)+'<br>Enrolled in: '+esc(p.department||'No department')+'</p><h3 style="margin:12px 0 6px;font-size:16px">Borrowing history</h3>'+(p.requests.length?p.requests.map(function(r){return'<div class="card" style="margin-top:8px"><div class="row sp"><b>'+esc(r.equipment)+' × '+r.qty+'</b><span class="badge '+r.status+'">'+(LBL[r.status]||r.status)+'</span></div><div class="mute">'+(r.type=='borrow'?'Borrow':'Reservation')+' · '+r.date_from+' to '+r.date_to+'</div><div class="mute">'+esc(r.purpose)+'</div>'+extra(r)+'</div>'}).join(''):'<div class="empty">No requests yet.</div>')+'<div class="row" style="margin-top:12px"><button class="btn" onclick="closeM()">Close</button></div>';
  document.getElementById('modal').classList.add('on')}catch(e){toast(e.message)}}
// ---------- departments (admin) ----------
function depOpts(){return(D.dep||[]).map(function(d){return'<option value="'+d.id+'">'+esc(d.name)+'</option>'}).join('')}
function depView(){var l=D.dep||[];
  return'<div class="card" style="margin-bottom:12px"><h3>Add department</h3><div class="row" style="margin-top:8px"><input id="dn" placeholder="e.g. Biology Laboratory" aria-label="Department name" style="flex:1;min-width:200px"><button class="btn p" onclick="addDep()">Add</button></div><div class="err" id="derr"></div></div>'+
  (l.length?'<div class="grid">'+l.map(function(d){return'<div class="card"><div class="row sp"><h3>'+esc(d.name)+'</h3><button class="btn no sm" onclick="delDep('+d.id+')">Remove</button></div><div class="mute">'+d.equipment+' equipment item'+(d.equipment==1?'':'s')+'</div><h3 style="margin:10px 0 4px;font-size:14px">Laboratory personnel</h3>'+(d.labs.length?d.labs.map(function(x){return'<div class="row sp" style="margin:4px 0"><span class="mute">'+esc(x.name)+' · '+esc(x.id_number)+'</span><button class="btn sm" onclick="openEdit('+x.id+',1)">Edit</button></div>'}).join(''):'<div class="mute">None yet.</div>')+'<details><summary>Add laboratory personnel</summary><label for="ln'+d.id+'">Full name</label><input id="ln'+d.id+'"><label for="le'+d.id+'">ID number</label><input id="le'+d.id+'" placeholder="e.g. LAB-101"><label for="lp'+d.id+'">Temporary password (8+ characters)</label><input id="lp'+d.id+'" type="password"><div class="err" id="lerr'+d.id+'"></div><button class="btn p sm" onclick="addLab('+d.id+')">Create account</button></details></div>'}).join('')+'</div>':'<div class="empty">No departments yet.</div>')}
async function addDep(){try{await api('/departments','POST',{name:document.getElementById('dn').value});toast('Department added');go('dep')}catch(e){document.getElementById('derr').textContent=e.message}}
async function delDep(id){try{await api('/departments/'+id,'DELETE');go('dep')}catch(e){toast(e.message)}}
async function addLab(id){var v=function(p){return document.getElementById(p+id).value};try{await api('/departments/'+id+'/lab','POST',{name:v('ln').trim(),idNumber:v('le').trim(),password:v('lp')});toast('Laboratory personnel added');go('dep')}catch(e){document.getElementById('lerr'+id).textContent=e.message}}
// ---------- edit or remove an account (admin) ----------
function findUser(id,lab){var r=null;
  if(lab)(D.dep||[]).forEach(function(d){d.labs.forEach(function(x){if(x.id==id)r=x})});
  else r=(D.people||[]).filter(function(x){return x.id==id})[0]||null;
  return r}
function openEdit(id,lab){var u=findUser(id,lab);if(!u)return;
  document.getElementById('mbody').innerHTML='<h2>Edit account</h2><p class="mute">'+(lab?ROLES.lab:ROLES[u.role])+'</p><label for="en">Full name</label><input id="en" value="'+esc(u.name)+'"><label for="ei">ID number</label><input id="ei" value="'+esc(u.id_number)+'"><label for="ed">'+(lab?'Department':'Enrolled department')+'</label><select id="ed"><option value="">Choose a department</option>'+depOpts()+'</select><label for="ep">New password (leave empty to keep the current one)</label><input id="ep" type="password" autocomplete="new-password"><div class="err" id="eerr"></div><div class="row" style="margin-top:8px"><button class="btn p" id="ebtn" onclick="saveEdit('+id+')">Save</button><button class="btn no" onclick="removeUser('+id+')">Remove account</button><button class="btn" onclick="closeM()">Cancel</button></div>';
  document.getElementById('ed').value=u.department_id||'';
  document.getElementById('modal').classList.add('on')}
async function saveEdit(id){var v=function(i){return document.getElementById(i).value},er=document.getElementById('eerr'),b=document.getElementById('ebtn');b.disabled=true;er.textContent='';
  try{await api('/users/'+id,'PATCH',{name:v('en').trim(),idNumber:v('ei').trim(),password:v('ep'),departmentId:v('ed')});closeM();toast('Account updated');go(tab)}
  catch(e){er.textContent=e.message;b.disabled=false}}
async function removeUser(id){if(!confirm('Remove this account? This cannot be undone.'))return;
  try{await api('/users/'+id,'DELETE');closeM();toast('Account removed');go(tab)}
  catch(e){document.getElementById('eerr').textContent=e.message}}
// ---------- inventory (admin and lab) ----------
// Lab personnel see only their assigned department. The admin sees every department, one section each.
// Damaged units: the admin can mark them repaired or replaced (they go back to available). Lab personnel can only view.
function damagedBox(e){var l=e.damaged_records||[],adm=U.role=='admin';
  if(!l.length)return'';
  return'<details><summary>Damaged units ('+e.damaged+' not available)</summary>'+l.map(function(x){var left=x.damaged_qty-x.repaired_qty;
    return'<div class="rec"><b>'+esc(x.requester)+'</b> <span class="mute">ID '+esc(x.id_number)+'</span><div class="mute">Damaged '+x.damaged_qty+' of '+x.qty+' · returned '+esc((x.returned_at||'').slice(0,10))+(x.return_notes?' · '+esc(x.return_notes):'')+'</div>'+
    (left>0?'<div class="od">'+left+' still damaged'+(x.repaired_qty?' ('+x.repaired_qty+' repaired or replaced)':'')+'</div>'+(adm?'<div class="row" style="margin-top:6px"><input id="rpq'+x.id+'" type="number" min="1" max="'+left+'" value="'+left+'" aria-label="Units repaired or replaced" style="width:80px"><button class="btn ok sm" onclick="repairItem('+x.id+')">Repaired or replaced</button></div>':''):'<div class="mute"><b>All '+x.damaged_qty+' repaired or replaced.</b> Back in the available stock.</div>')+'</div>'}).join('')+'</details>'}
async function repairItem(id){var el=document.getElementById('rpq'+id);
  try{var j=await api('/requests/'+id+'/repair','POST',{qty:el?+el.value:undefined});toast('Saved. '+j.available+' now available.');go('inv')}catch(e){toast(e.message)}}
function invCard(e){return'<div class="card"><h3>'+esc(e.name)+'</h3><div class="mute">'+esc(e.category)+' · '+esc(e.department||'No department')+'</div><p style="margin:6px 0"><span class="avail">'+e.available_today+'</span> of '+e.qty+' available today</p>'+(e.damaged?'<div class="od" style="font-size:13px">'+e.damaged+' damaged, not available</div>':'')+'<div class="row" style="margin-top:8px"><label style="margin:0">Total</label><input type="number" min="0" value="'+e.qty+'" aria-label="Total quantity" style="width:80px" onchange="setQty('+e.id+',this.value)"><button class="btn no sm" onclick="delEq('+e.id+')">Remove</button></div>'+damagedBox(e)+'</div>'}
function invView(){var lab=U.role=='lab',items=D.inv||[],groups={},names=[];
  items.forEach(function(e){var n=e.department||'No department';if(!groups[n]){groups[n]=[];names.push(n)}groups[n].push(e)});
  names.sort();
  var form='<div class="card" style="margin-bottom:12px"><h3>Add equipment</h3>'+(lab?'<p class="mute">New items are added to your department.</p>':'')+'<div class="row" style="margin-top:8px"><input id="an" placeholder="Name" aria-label="Name" style="flex:2;min-width:140px"><input id="ac" placeholder="Category" aria-label="Category" style="flex:1;min-width:100px">'+(lab?'':'<select id="ad" aria-label="Department" style="flex:1;min-width:140px">'+depOpts()+'</select>')+'<input id="aq" type="number" min="1" value="1" aria-label="Quantity" style="flex:0 0 80px"><button class="btn p" onclick="addEq()">Add</button></div><div class="err" id="aerr"></div></div>';
  var body=names.length?names.map(function(n){var g=groups[n];
    return'<div class="dh"><h3>'+esc(n)+'</h3><span class="mute">'+g.length+' item'+(g.length==1?'':'s')+'</span></div><div class="grid">'+g.map(invCard).join('')+'</div>'}).join(''):'<div class="empty">No equipment'+(lab?' in your department':'')+' yet.</div>';
  return form+body}
async function addEq(){var n=document.getElementById('an').value.trim(),ad=document.getElementById('ad');try{await api('/equipment','POST',{name:n,category:document.getElementById('ac').value.trim(),qty:+document.getElementById('aq').value,departmentId:ad?ad.value:undefined});toast('Equipment added');go('inv')}catch(e){document.getElementById('aerr').textContent=e.message}}
async function setQty(id,v){try{await api('/equipment/'+id,'PATCH',{qty:+v});toast('Quantity updated');go('inv')}catch(e){toast(e.message)}}
async function delEq(id){if(!confirm('Remove this equipment? Its request history will be removed too.'))return;try{await api('/equipment/'+id,'DELETE');go('inv')}catch(e){toast(e.message)}}
// ---------- accounts (admin) ----------
function usrView(){var l=D.people||[];
  return'<div class="card" style="max-width:440px"><h3>Create an account</h3><p class="mute">Use this for students and faculty members. Laboratory personnel are added inside their department.</p><label for="un">Full name</label><input id="un"><label for="ue">ID number</label><input id="ue" placeholder="Student: 20231234 · Faculty: FAC-12345"><label for="up">Temporary password (8+ characters)</label><input id="up" type="password"><label for="ud">Enrolled department</label><select id="ud"><option value="">Choose a department</option>'+depOpts()+'</select><label for="ur">Role</label><select id="ur"><option value="student">Student</option><option value="faculty">Faculty member</option></select><div class="err" id="uerr"></div><button class="btn p" onclick="addUser()">Create account</button></div>'+
  '<h3 style="margin:20px 0 8px">Students and faculty</h3>'+
  (l.length?'<div class="grid">'+l.map(function(p){return'<div class="card"><h3>'+esc(p.name)+'</h3><div class="mute">'+ROLES[p.role]+' · ID '+esc(p.id_number)+'</div><div class="mute">Enrolled in: '+esc(p.department||'No department')+'</div><button class="btn sm" style="margin-top:8px" onclick="openEdit('+p.id+')">Edit</button></div>'}).join('')+'</div>':'<div class="empty">No students or faculty yet.</div>')}
async function addUser(){var v=function(i){return document.getElementById(i).value.trim()};try{await api('/users','POST',{name:v('un'),idNumber:v('ue'),password:document.getElementById('up').value,role:v('ur'),departmentId:v('ud')});toast('Account created');go('usr')}catch(e){document.getElementById('uerr').textContent=e.message}}
// Load the signed-in person's department for the header, then draw the page.
if(U){api('/me').then(function(m){U.department=m.department;U.departmentId=m.department_id;render()}).catch(function(){render()})}else render();
</script>
</body>
</html>
